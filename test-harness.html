<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Evently — all event types test</title>
<style>
  body { font-family: Consolas, monospace; padding: 18px; }
  #out { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  iframe { width: 1100px; height: 700px; border: 1px solid #ccc; margin-top: 16px; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script>
/* Drives the real UI for every event type. Fully synchronous: everything runs
   inside the iframe load handler, before this parent document fires load. */
document.getElementById('f').onload = function () {
  const lines = [];
  let pass = 0, fail = 0;
  const check = (name, cond, extra) => {
    if (cond) { pass++; lines.push('[PASS] ' + name); }
    else { fail++; lines.push('[FAIL] ' + name + (extra !== undefined ? '  -> got: ' + extra : '')); }
  };
  const section = (t) => { lines.push(''); lines.push('--- ' + t + ' ---'); };

  const f = document.getElementById('f');
  const d = f.contentDocument;
  const w = f.contentWindow;
  const $ = id => d.getElementById(id);
  const vis = id => !$(id).classList.contains('hidden');
  const txt = id => ($(id) ? $(id).textContent : '');
  /* Card titles render as <h3><span class="card-icon">🎯</span>Event concept</h3>,
     so compare against the label only, with the icon stripped. */
  const cardTitles = () => {
    const out = [];
    d.querySelectorAll('#planGrid .plan-card').forEach(c => {
      const h3 = c.querySelector('h3');
      const icon = h3.querySelector('.card-icon');
      let t = h3.textContent;
      if (icon) t = t.slice(icon.textContent.length);
      out.push(t.replace(/\s+/g, ' ').trim());
    });
    return out;
  };
  const ET = () => w.EVENTLY.EVENT_TYPES;

  const VISION = 'I want an elegant but fun celebration for about 80 guests. ' +
                 'I love Indian food, music and beautiful outdoor spaces, with lots of candles and white flowers. ' +
                 'My grandmother needs wheelchair access, so please keep that in mind.';

  /* Expected plan sections per event type, from the brief. */
  const EXPECTED = {
    custom: ["Event concept","Theme & atmosphere","Venue type","Guest experience","Food & catering","Decorations","Entertainment","Budget breakdown"],
    wedding: ["Wedding concept","Theme, colours & style","Venue plan","Ceremony plan","Reception plan","Catering","Decorations & florals","Entertainment","Photography","Cake & desserts","Guest experience","Budget breakdown"],
    birthday: ["Birthday concept","Theme","Venue type","Food & cake","Entertainment","Decorations","Activities","Budget breakdown"],
    anniversary: ["Anniversary concept","Atmosphere & theme","Venue","Food","Entertainment","Décor","Special moments","Budget breakdown"],
    baby: ["Baby shower concept","Theme","Venue setup","Food & desserts","Decorations","Games & activities","Gift ideas","Budget breakdown"],
    graduation: ["Graduation concept","Theme","Venue","Food","Entertainment","Decorations","Activities","Budget breakdown"],
    corporate: ["Event concept","Recommended format","Venue requirements","Agenda","Catering","Audio/visual","Branding","Entertainment","Networking ideas","Budget breakdown"],
    "high-tea": ["High tea concept","Theme & atmosphere","Menu & tiers","Drinks service","Décor & table setting","Entertainment","Budget breakdown"],
    engagement: ["Engagement concept","Atmosphere & theme","Venue","Food & drinks","Entertainment","Décor","Special moments","Budget breakdown"],
    "wedding-shower": ["Wedding shower concept","Theme","Venue setup","Food & desserts","Decorations","Activities","Gift ideas","Budget breakdown"]
  };

  const LABELS = {
    custom: "Custom Event", wedding: "Wedding", birthday: "Birthday", anniversary: "Anniversary",
    baby: "Baby Shower", graduation: "Graduation", corporate: "Corporate Event",
    "high-tea": "High Tea", engagement: "Engagement", "wedding-shower": "Wedding Shower"
  };

  function showHome() {
    $('planner').classList.add('hidden');
    $('plan').classList.add('hidden');
    $('home').classList.remove('hidden');
  }

  function showHomeAndStart(key) {
    showHome();
    d.querySelector('[data-type="' + key + '"]').click();
  }

  /* Fill whatever the current step asks for, generically. */
  function fillStep(q) {
    const inp = $('answerInput');
    if (q.type === 'vision') { inp.value = VISION; return; }
    if (q.type === 'chips') {
      const chips = d.querySelectorAll('#questionInput .chip');
      chips[0].click();
      if (chips.length > 2) chips[1].click();
      return;
    }
    if (q.type === 'date') { inp.value = '2027-06-14'; return; }
    if (q.type === 'number') {
      inp.value = q.key === 'guests' ? '80' : (q.key === 'budget' ? '15000' : '10');
      return;
    }
    /* The location-ish text question differs per type (location vs ceremonyPlace). */
    if (q.key === 'location' || q.key === 'ceremonyPlace') inp.value = 'Austin, TX';
    else if (q.key === 'company') inp.value = 'Northwind Analytics';
    else inp.value = 'Sample ' + q.key;
  }

  /* Run one event type end to end and gather diagnostics. */
  function runType(key) {
    const def = ET()[key];
    const qs = def.questions;

    showHomeAndStart(key);
    const plannerOpened = vis('planner') && !vis('home');
    const total = $('stepTotal').textContent;

    let reachedAll = true, visionSeen = false, chipQuestions = 0, visionPlaceholder = '';
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i];
      if (q.type === 'vision') {
        const ta = $('answerInput');
        visionSeen = !!ta && ta.tagName === 'TEXTAREA';
        if (ta) visionPlaceholder = ta.placeholder || '';
      } else if (q.type === 'chips') chipQuestions++;

      const onStep = q.type === 'vision'
        ? /final step/i.test(txt('questionLabel'))
        : $('qNum').textContent === String(i + 1);
      if (!onStep) reachedAll = false;

      fillStep(q);
      $('nextBtn').click();
    }

    return {
      key, def, qs, titles: cardTitles(), grid: txt('planGrid'),
      planShown: vis('plan') && !vis('planner'), plannerOpened,
      visionSeen, visionPlaceholder, total, reachedAll, chipQuestions,
      timeline: d.querySelectorAll('#timelineList li').length,
      checklist: d.querySelectorAll('#checklistList li').length,
      consid: d.querySelectorAll('#considerationsList li').length,
      visionEcho: vis('planVision'),
      budgetRows: d.querySelectorAll('#planGrid .budget-row').length,
      summary: txt('planSummary')
    };
  }

  try {
    /* ============ 1. all cards enabled ============ */
    section('Event-type cards');
    const allCards = d.querySelectorAll('.type-grid .type-card');
    check('10 event-type cards on the page', allCards.length === 10, allCards.length);
    let disabledCount = 0;
    allCards.forEach(c => { if (c.disabled || c.classList.contains('disabled')) disabledCount++; });
    check('no disabled cards remain', disabledCount === 0, disabledCount + ' disabled');
    check('no "Coming soon" badges remain', d.querySelectorAll('.badge-soon').length === 0,
      d.querySelectorAll('.badge-soon').length + ' badges');

    Object.keys(LABELS).forEach(k => {
      const c = d.querySelector('[data-type="' + k + '"]');
      check('card exists: ' + LABELS[k], !!c);
      if (c) check('card enabled: ' + LABELS[k], !c.disabled && !c.classList.contains('disabled'));
    });

    /* ============ 2. the six required flows ============ */
    ['custom', 'wedding', 'birthday', 'anniversary', 'baby', 'graduation'].forEach(key => {
      section('Flow: ' + LABELS[key]);
      const r = runType(key);

      check('questionnaire opened', r.plannerOpened);
      check('walked all ' + r.qs.length + ' questions in order', r.reachedAll);
      check('progress total matches question count', r.total === String(r.qs.length),
        r.total + ' vs ' + r.qs.length);
      check('has a "Describe your vision" final step', r.visionSeen);
      check('vision step has an example placeholder', r.visionPlaceholder.length > 30);
      check('has event-specific chip questions (' + r.chipQuestions + ')', r.chipQuestions >= 3,
        r.chipQuestions);
      check('plan generated', r.planShown);
      check('vision echoed under "In your words"', r.visionEcho);
      check('timeline rendered', r.timeline >= 5, r.timeline);
      check('checklist rendered', r.checklist >= 6, r.checklist);
      check('considerations rendered', r.consid >= 4, r.consid);
      check('budget rows rendered', r.budgetRows >= 6, r.budgetRows);

      const missing = EXPECTED[key].filter(t => r.titles.indexOf(t) === -1);
      check('has all required sections for ' + LABELS[key], missing.length === 0,
        'missing: [' + missing.join(', ') + '] got: ' + r.titles.join(' | '));

      check('personalized from structured answers (80 guests)', /80/.test(r.summary), r.summary);
      check('personalized from structured answers (Austin)', /Austin/.test(r.summary), r.summary);
      check('personalized from the vision (Indian food)', /Indian/.test(r.grid), 'no Indian');
      check('personalized from the vision (outdoor)', /outdoor/i.test(r.grid), 'no outdoor');
      check('personalized from the vision (wheelchair need)',
        /wheelchair|step-free/i.test(r.grid + txt('considerationsList')), 'no accessibility note');
    });

    /* ============ 3. Corporate ============ */
    section('Flow: Corporate Event');
    const rc = runType('corporate');
    check('questionnaire opened', rc.plannerOpened);
    check('walked all ' + rc.qs.length + ' questions', rc.reachedAll);
    check('has a "Describe your vision" final step', rc.visionSeen);
    check('plan generated', rc.planShown);
    const missingC = EXPECTED.corporate.filter(t => rc.titles.indexOf(t) === -1);
    check('has all required corporate sections', missingC.length === 0,
      'missing: [' + missingC.join(', ') + '] got: ' + rc.titles.join(' | '));
    check('agenda section renders ordered items',
      d.querySelectorAll('#planGrid .agenda-list li').length >= 5,
      d.querySelectorAll('#planGrid .agenda-list li').length);
    check('corporate plan reflects the stated objective',
      /Sample purpose/.test(rc.grid), 'objective not reflected');
    check('corporate budget has 7 categories', rc.budgetRows === 7, rc.budgetRows);

    /* ============ 4. the remaining three ============ */
    ['high-tea', 'engagement', 'wedding-shower'].forEach(key => {
      section('Flow: ' + LABELS[key]);
      const r = runType(key);
      check('walked all ' + r.qs.length + ' questions', r.reachedAll);
      check('has a vision step', r.visionSeen);
      check('plan generated', r.planShown);
      const missing = EXPECTED[key].filter(t => r.titles.indexOf(t) === -1);
      check('has all required sections', missing.length === 0,
        'missing: [' + missing.join(', ') + '] got: ' + r.titles.join(' | '));
      check('vision echoed', r.visionEcho);
      check('personalized from the vision', /Indian/.test(r.grid), 'no Indian');
    });

    /* ============ 5. questions genuinely differ per type ============ */
    section('Question sets differ by type');
    const T = ET();
    check('wedding asks about ceremony type', T.wedding.questions.some(q => q.key === 'ceremonyType'));
    check('wedding asks about wedding party size', T.wedding.questions.some(q => q.key === 'partySize'));
    check('wedding asks about cake', T.wedding.questions.some(q => q.key === 'cake'));
    check('wedding asks about invitations', T.wedding.questions.some(q => q.key === 'invitations'));
    check('wedding asks about transportation', T.wedding.questions.some(q => q.key === 'transport'));
    check('wedding asks about traditions', T.wedding.questions.some(q => q.key === 'traditions'));
    check('birthday asks about the milestone', T.birthday.questions.some(q => q.key === 'milestone'));
    check('birthday asks about interests', T.birthday.questions.some(q => q.key === 'interests'));
    check('anniversary asks about memories', T.anniversary.questions.some(q => q.key === 'memories'));
    check('anniversary asks about surprises', T.anniversary.questions.some(q => q.key === 'surprise'));
    check('baby shower asks about the due date', T.baby.questions.some(q => q.key === 'dueDate'));
    check('baby shower asks about games', T.baby.questions.some(q => q.key === 'games'));
    check('baby shower asks about gifts', T.baby.questions.some(q => q.key === 'gifts'));
    check('graduation asks about the school', T.graduation.questions.some(q => q.key === 'school'));
    check('graduation asks about achievements', T.graduation.questions.some(q => q.key === 'achievements'));
    check('corporate asks about the company', T.corporate.questions.some(q => q.key === 'company'));
    check('corporate asks about AV', T.corporate.questions.some(q => q.key === 'av'));
    check('corporate asks about branding', T.corporate.questions.some(q => q.key === 'branding'));
    check('corporate asks about networking', T.corporate.questions.some(q => q.key === 'networking'));
    check('corporate asks about accessibility', T.corporate.questions.some(q => q.key === 'accessibility'));

    const sets = Object.keys(T).map(k => T[k].questions.map(q => q.key).join(','));
    check('all 10 question sets are distinct', new Set(sets).size === 10,
      new Set(sets).size + ' distinct');
    check('wedding asks more than the custom flow',
      T.wedding.questions.length > T.custom.questions.length,
      T.wedding.questions.length + ' vs ' + T.custom.questions.length);
    Object.keys(T).forEach(k => {
      check(LABELS[k] + ' ends with a vision step',
        T[k].questions[T[k].questions.length - 1].type === 'vision', k);
      check(LABELS[k] + ' has a distinct plan title',
        typeof T[k].planTitle === 'function', k);
    });

    /* custom flow must remain exactly as it was */
    section('Custom Event preserved');
    check('custom still asks exactly 13 questions', T.custom.questions.length === 13,
      T.custom.questions.length);
    check('custom keeps the original Q1 wording',
      T.custom.questions[0].label === "What would you like to celebrate?",
      T.custom.questions[0].label);
    check('custom keeps the original Q2 wording',
      T.custom.questions[1].label === "What is the event date?", T.custom.questions[1].label);
    check('custom keeps venue/style/food/entertainment/decor chips',
      ['venue', 'style', 'food', 'entertainment', 'decor'].every(k => T.custom.questions.some(q => q.key === k)));
    check('custom still produces its original 8 sections',
      EXPECTED.custom.length === 8, EXPECTED.custom.length);

    /* ============ 6. navigation ============ */
    section('Navigation');
    showHomeAndStart('wedding');
    T.wedding.questions.forEach(q => { fillStep(q); $('nextBtn').click(); });
    check('wedding plan shown', vis('plan'));
    d.querySelector('.logo').click();
    check('header logo returns home from a plan', vis('home'),
      'planner=' + vis('planner') + ' plan=' + vis('plan'));

    showHomeAndStart('birthday');
    T.birthday.questions.forEach(q => { fillStep(q); $('nextBtn').click(); });
    check('birthday plan shown', vis('plan'));
    const bet = $('planEventTypes');
    check('"Back to event types" button exists', !!bet);
    if (bet) {
      bet.click();
      check('"Back to event types" returns to the homepage', vis('home'),
        'planner=' + vis('planner') + ' plan=' + vis('plan'));
    }

    showHomeAndStart('graduation');
    T.graduation.questions.forEach(q => { fillStep(q); $('nextBtn').click(); });
    check('graduation plan shown', vis('plan'));
    $('restartBtn').click();
    check('"Start over" returns to the planner', vis('planner'),
      'planner=' + vis('planner') + ' plan=' + vis('plan'));
    check('"Start over" keeps the same event type',
      /graduation/i.test(txt('plannerHeading')), txt('plannerHeading'));
    check('"Start over" resets to question 1', $('qNum').textContent === '1', $('qNum').textContent);
    check('"Start over" clears previous answers',
      !$('answerInput') || $('answerInput').value === '',
      $('answerInput') ? $('answerInput').value : 'none');

    showHomeAndStart('baby');
    check('planner heading names the event type',
      /baby shower/i.test(txt('plannerHeading')), txt('plannerHeading'));
    showHomeAndStart('high-tea');
    check('planner heading updates for high tea',
      /high tea/i.test(txt('plannerHeading')), txt('plannerHeading'));

    /* back button preserves answers across a type's own questions */
    showHomeAndStart('corporate');
    const q1 = $('answerInput');
    q1.value = 'Northwind Analytics';
    $('nextBtn').click();
    check('advanced to question 2', $('qNum').textContent === '2', $('qNum').textContent);
    $('prevBtn').click();
    check('Back preserves the typed answer', $('answerInput').value === 'Northwind Analytics',
      $('answerInput').value);

    /* empty answers are still blocked */
    showHomeAndStart('wedding');
    $('nextBtn').click();
    check('empty answer blocks advancing', $('qNum').textContent === '1', $('qNum').textContent);

    /* ============ 7. layout ============ */
    section('Layout');
    check('no horizontal overflow on the homepage',
      d.documentElement.scrollWidth <= w.innerWidth + 1,
      'scrollWidth=' + d.documentElement.scrollWidth + ' viewport=' + w.innerWidth);

  } catch (err) {
    fail++;
    lines.push('');
    lines.push('[FAIL] harness threw: ' + (err && err.stack ? err.stack : err));
  }

  lines.push('');
  lines.push('=====================================');
  lines.push('TOTAL: ' + (pass + fail) + '   PASSED: ' + pass + '   FAILED: ' + fail);
  lines.push('=====================================');
  const fails = lines.filter(l => l.indexOf('[FAIL]') === 0);
  if (fails.length) {
    lines.push('');
    lines.push('FAILURE RECAP:');
    fails.forEach(l => lines.push('  ' + l));
  }
  document.getElementById('out').textContent = lines.join('\n');
};
</script>
</body>
</html>
